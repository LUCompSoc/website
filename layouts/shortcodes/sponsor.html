{{ $name := .Get "name" }}
{{ $img := .Get "img" }}
{{ $href := .Get "href" }}

{{ $resource := resources.Get ($img) }}

<div class="w-full h-fit flex flex-row justify-center gap-3 flex-wrap">
    <a href="{{ $href }}" class="flex h-24 items-center">
        <img src="{{ $resource.RelPermalink }}" class="nozoom h-24 w-auto bg-white p-2 rounded-xl" />
    </a>
</div>
