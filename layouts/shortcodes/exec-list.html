{{ range hugo.Data.execs }}
    {{ printf "## %s" .year | markdownify }}
    <span class="w-2/1 h-auto flex flex-row flex-wrap gap-5">
        {{ range .execs }}
            {{ template "exec-card" . }}
        {{ end }}
    </span>
{{ end }}

{{ define "exec-card"}}
    <div class="aspect-square size-50 border border-4 border-secondary-500 rounded-2xl p-2">
        <h4>{{ .name }}</h4>
        <p>{{ .role }}</p>
    </div>
{{ end }}
